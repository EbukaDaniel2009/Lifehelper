{q:[["What do you need help with?",["Writing or improving my CV","Preparing for an interview","Finding and tracking job applications"]],["Where are you now?",["I have never had a job","I have some experience","I want to change career"]]],
t:[["A CV is a short advert for you. Its only job is to get you an interview, so every line should help the employer see why you fit the role.","An interview is a conversation, not a test. Employers want to see that you are honest, prepared and easy to work with.","Job hunting works best as a routine. A few careful applications beat the same message sent everywhere."],["Having no job history is fine. Use school work, volunteering, church or community tasks, and helping at home or in a family business as real evidence of your skills.","With some experience, focus on results: what changed because of your work, with a number if you honestly can.","When changing career, show the skills that carry over, such as communication, reliability and problem solving, and explain simply why you are making the move."]],
s:[["Choose one clear target","Pick one kind of job to aim at first. A clear target lets you choose the right words, skills and examples, instead of writing something vague that fits nothing."],["Collect your evidence","Write down 5 things you have done well, with what you did and what happened. These become your CV points and your interview stories."],["Write or practise with that evidence","Use short sentences that begin with action words such as organised, taught, repaired or sold. Read your CV aloud, or practise answers aloud, until it sounds natural and honest."],["Check, then act","Ask someone you trust to check spelling and clarity. Then apply, and note the date and deadline in the Jobs tool so nothing is missed."]],

t:[["A budget is a plan for your money before the month starts. It gives every coin and note a job.","Saving works best when it is automatic and small. The habit matters more than the amount at the start.","Controlling spending starts with seeing where money goes. Most people find two or three small leaks."],["With steady income you can plan the whole month and set fixed amounts for each need.","With changing income, plan using your lowest usual month and treat extra money as a bonus for savings.","With little income, put essentials first and write down every spend. Small, honest records show what can wait."]],
s:[["Know what comes in","Write your income for the month. If it changes, use the lowest amount you usually receive, so you are never caught short."],["List what you must pay","Rent, transport, food, data, school and bills come first. These cannot be skipped, so they are protected before anything else."],["Set aside savings first","Choose a small amount and move it as soon as money arrives. Saving what is left over rarely works, because it is usually nothing."],["Record and review","Use the Budget tool for two weeks and look at the two biggest leaks. A short weekly review keeps the plan alive."]],
x:["Forgetting irregular costs such as repairs and events","Having no small emergency pot","Tracking only big purchases, not small daily ones"]},
{q:[["What do you want?",["Plan my day","Reach a goal","Build a habit"]],["What gets in the way?",["Too many things to do","I keep putting things off","I forget and lose track"]]],

s:[["Write it all down","Get everything out of your head and onto a list. A written list lowers stress and shows you what is real."],["Pick what matters","Choose the three most important items and give each a time. What has a time is more likely to happen."],["Start small","Begin with the easiest first step. Starting is the hardest part, and momentum follows."],["Review and adjust","At the end of the day tick what is done and move the rest. Treat a missed day as information, not failure."]],

s:[["Define the target","Write exactly what you must know or do, and by when. A clear target stops you studying everything and finishing nothing."],["Break it into topics","List the topics and mark the ones you find hardest. Start with the hard ones while your energy is fresh."],["Learn, then test yourself","After each topic, close the book and write what you remember. Finding what you forgot is where most learning happens."],["Review on a schedule","Revisit each topic after a day, after a week, and before the exam. Repeating over time makes memory last."]],

function WQv2(){const r=WQc();S.plans.unshift({id:Date.now(),t:"Job plan: "+r.T+" ("+WAP[r.ap]+")",s:r.P.map(p=>({t:p[0]+": "+p[1],d:0}))});sv();go('saved')}
const GC={
2:{n:"Planning Coach",tx:"Describe what you want to achieve, in one sentence",xh:"Tools to use",d:"General educational guidance, not professional advice.",
AP:["Priority planning","Small steps and rhythm","Time blocks"],
q:[["What do you want to plan?",["My day","My week","A big goal","A new habit"]],["What gets in the way most?",["Too many things to do","I keep putting things off","I forget things","I get tired or lose energy"]],["Your situation",["I am a student","I am working","I study and work","I am mostly at home"]],["Time you can give each day",["Under 15 minutes","15 to 45 minutes","More than 45 minutes"]]],
S:[["A day plan works when it is short and realistic, with space for the unexpected.","A week plan shows the bigger picture, so hard tasks can go on days when you have energy.","A big goal needs stages, because a large goal with no first step stays a wish.","A habit grows from a tiny action done daily, not from big effort once in a while."],
["Having too many things to do usually means nothing has been prioritised, so the first job is choosing what matters most.","Putting things off usually means a task feels too big, unclear or unpleasant, so we make the first step small and clear.","Forgetting is a memory-system problem, not a character problem, so everything goes in one trusted place.","Low energy means the plan must respect your limits, so hard tasks go to your best time of day and rest is planned."],
["As a student, your fixed points are classes and deadlines, so we plan around them first.","With a job, your work hours are fixed, so planning uses the gaps and protects your rest.","Studying and working leaves little spare time, so every block needs a clear purpose.","Being mostly at home gives flexibility, but flexibility needs structure, so fixed anchor times matter."],
["With under 15 minutes, the system is a short daily check-in.","With 15 to 45 minutes, you can plan the day and review it each evening.","With more than 45 minutes, you can also include deeper goal work, but keep it simple."]],
K:["How to plan a day: write everything down, choose three priorities, give each a time, and leave free space for surprises. Start with the hardest priority when your energy is best, and stop adding to the list when it fits the time you really have.","How to plan a week: list fixed commitments first, then place important tasks on the days with the most free time, and put a lighter day in the middle. Weekly planning stops everything landing on the last day.","How to pursue a big goal: write it in one sentence, set a finish date, split it into three stages, and name for each stage a first action that takes under thirty minutes. Review monthly and adjust.","How habits form: choose one tiny action, attach it to something you already do each day, make it easy to start, and track it. Missing once is normal. Missing twice is the signal to restart at once."],
P:[[["Write everything down","Put everything related to {T} and your other tasks on one list. A written list clears mental clutter and shows what is real."],["Choose three priorities","Pick the three tasks that move {T} forward most. Everything else is extra. Three important things done beat ten small ones."],["Give each one a time","Assign a start time to each priority. A task with a time is far more likely to happen than a task on a list."],["Review each evening","Tick what is done, move what is not, and write tomorrow’s three. Treat a missed task as information and ask what made it hard."]],
[["Make the first step tiny","Break {T} into the smallest step, one that takes under five minutes. Starting is the hardest part, and a tiny step removes the resistance."],["Attach it to your day","Link the step to something you already do, such as after breakfast or after prayer. Linked actions become automatic."],["Track it daily","Mark each day you do it in the Goals & Habits tool. A visible streak motivates you, and one missed day is not failure."],["Grow it slowly","After two weeks, make the step a little bigger. Slow growth lasts longer than a big start that burns out."]],
[["Block your time","Mark fixed times for work, study, meals and rest. What is left is your free time for {T}."],["Put it in your best hours","Notice when you think most clearly and put the hardest part of {T} there. Easy tasks fit tired hours."],["Protect the block","Silence your phone and tell people you are busy. A short protected block beats a long interrupted one."],["Plan rest too","Add breaks and one free evening a week. Rest is part of the plan, because tired work is slow and full of mistakes."]]],
X:[["Daily Tasks tool","Add your three priorities with a due date and tick them off as you go."],["Goals & Habits tool","Record the goal or habit and mark progress every day."],["Weekly review questions","Every Sunday ask: What worked? What did not? What one thing will I change next week?"]],
W:["Planning more than you can do in one day","Waiting to feel motivated before starting","Quitting after one missed day"]},
3:{n:"Learning Coach",tx:"What exactly do you want to learn or pass?",xh:"Tools to use",d:"General educational guidance, not professional advice.",
AP:["Test-yourself method","Little and often","Teach to learn"],
q:[["What are you doing?",["Learning a new skill","Studying for an exam","Learning a language","Catching up on a hard subject"]],["What is your biggest problem?",["I forget what I study","I cannot focus","I do not know where to start","I run out of time"]],["Your level",["Complete beginner","Some knowledge","Advanced, I want to improve"]],["Time per day",["Under 30 minutes","About 1 hour","2 hours or more"]]],
S:[["A new skill grows fastest when you practise by making something small early.","Exams reward recall, so most of your practice should be testing yourself.","A language is learned by little and often, mixing listening, speaking, reading and writing.","A hard subject becomes easier when you go back to the basic idea and rebuild step by step."],
["Forgetting is normal. Memory improves when you review at spaced times and test yourself.","Focus improves with short blocks, a clear target for each block, and the phone out of reach.","Not knowing where to start is solved by writing exactly what you must know and splitting it into topics.","Running out of time means choosing what matters most and studying it first."],
["As a complete beginner, start with the basics and expect early progress to feel slow.","With some knowledge, find the gaps by testing yourself before studying anything new.","At an advanced level, progress comes from harder practice and feedback, not more reading."],
["With under 30 minutes a day, one topic with full attention is enough.","With about an hour, use two focused blocks with a break between them.","With two hours or more, mix subjects and take real breaks, because tired study wastes time."]],
K:["Learning a skill: define what you want to be able to do, find one or two trusted sources, practise on a small real task every session, and keep what you make. Reading about a skill is not the same as being able to do it.","Exam study: list the topics and mark each as strong, medium or weak. Study the weak ones first, then test yourself on past questions with a time limit. Explain each topic aloud in your own words, because if you cannot explain it you do not yet know it.","Language learning: study a little every day, learn the most common words first, say sentences aloud, listen to real speech, and use new words in sentences of your own. Do not wait until you feel ready to speak.","Catching up: find the exact point where you stopped understanding, go back to that idea and build forward. Ask a teacher or classmate one specific question instead of describing a general problem."],
P:[[["Define the target","Write exactly what you must be able to do or know about {T}, and by what date. A precise target stops you studying everything and finishing nothing."],["Split it into topics","List the topics in {T} and mark each strong, medium or weak. Start with the weak ones while your energy is fresh."],["Study, then close the book","After each topic, close the book and write all you remember. What you forgot shows what to study next. Use the Study Helper to make a test from your notes."],["Review on a schedule","Review each topic after one day, one week, and just before the exam or deadline. Repeating over time is what makes memory last."]],
[["Pick a fixed time","Choose a daily time for {T} and keep it. A regular time becomes a habit, so you rely less on willpower."],["One small goal per session","Decide before you start what you will finish today, such as one lesson or ten words. Finishing a small goal builds momentum."],["Make something","End each session by producing something, such as a summary, a short piece of work or a spoken sentence. Making turns reading into skill."],["Check weekly","Once a week, look at what you completed and adjust. Celebrate steady progress."]],
[["Learn one idea","Choose one idea from {T} and study it until you can follow it."],["Explain it simply","Explain the idea aloud as if teaching a younger person, or write it in simple words. Where you get stuck is what you do not yet understand."],["Fix the gap","Go back to your source for only the part you could not explain, then explain it again."],["Teach someone","Explain it to a friend or family member. Teaching is one of the strongest ways to remember."]]],
X:[["Study Helper (Premium)","Paste your notes to get key points, a practice test and a score. Find it in the Learning tab."],["Learning Planner tool","Add each lesson or practice session and tick it when done."],["A study block","Work 25 minutes with the phone away, rest 5 minutes, and repeat. After four blocks take a longer break."]],
W:["Rereading notes instead of testing yourself","Studying late and sleeping badly","Leaving the hardest topic until last"]},
4:{n:"Communication Coach",tx:"In one or two sentences, what do you need to say or solve? (No names, please)",xh:"Phrases you can use",d:"General educational guidance, not professional advice.",
AP:["Calm structure","Understand first","Prepare and practise"],
q:[["What is the situation?",["A difficult conversation","A conflict or argument","Speaking with more confidence","Saying no or setting a limit"]],["Who is it with?",["Family or a close friend","A partner","Someone at work or school","Someone I do not know well"]],["How do you usually react?",["I stay quiet and avoid it","I get angry or raise my voice","I try to please everyone","I am calm but unsure what to say"]],["How soon is it?",["Today or tomorrow","This week","No date yet"]]],
S:[["A difficult conversation goes better when you know the one outcome you want and stay calm.","A conflict usually has two sides who both feel unheard, so the first goal is understanding, not winning.","Confidence is a skill that grows from preparation, slow breathing and small practice.","Saying no clearly and kindly protects your time and your relationships."],
["With family or close friends feelings run strong, so begin by saying that the relationship matters to you.","In a close relationship, choose a calm, private time and speak about your own feelings, not the other person’s faults.","At work or school, stay factual, polite and specific, and suggest a clear next step.","With someone you do not know well, be brief and respectful, and remember that customs and expectations may differ."],
["If you tend to stay quiet, write your main point beforehand and say it first, before nerves take over.","If you tend to get angry, plan a pause: take three slow breaths before answering, and agree that either of you can take a break.","If you try to please everyone, decide in advance what is not negotiable for you and say it kindly but clearly.","If you are calm but unsure what to say, a simple structure helps: what happened, how it affected me, what I ask."],
["Because it is soon, practise your first sentence aloud today and prepare a calm start.","You have a few days, so write notes and practise twice aloud, once alone and once with someone you trust.","With no date yet, prepare at your own pace and choose the moment carefully."]],
K:["A difficult conversation: decide your outcome, choose a calm private time, describe what happened without blame, listen fully, repeat back what you heard, and agree one clear next step.","A conflict: separate the person from the problem, ask the other person to explain how they see it, find what you both want, and look for a solution that gives each side something.","Confidence: prepare one or two opening sentences, slow your breathing, sit or stand upright, speak slightly slower than usual, and practise first in low-risk situations.","Saying no: give the answer first, add a short reason if you want to, offer an alternative only if you truly mean it, and do not apologise again and again."],
P:[[["Decide the outcome","Write one sentence about what you want from the conversation about {T}. It stops you arguing about the past."],["Choose the moment","Pick a calm, private time. Do not raise a hard topic when either of you is tired, hungry or in public."],["Say it in three parts","Say what happened, how it affected you, and what you ask. For example: ‘When this happened, I felt this. It would help if…’"],["Listen and agree","Let the other person speak without interrupting, repeat what you heard, and agree one clear action with a date."]],
[["Start with the relationship","Open with something true and kind, such as ‘I want us to understand each other about this.’"],["Ask, then listen","Ask how they see it and listen until they finish. People soften when they feel heard."],["Share your side","Explain your side calmly with one or two facts and your feelings. Avoid ‘always’ and ‘never’."],["Find the common goal","Name what you both want and suggest one solution that gives each of you something."]],
[["Write your main point","Write your message about {T} in two sentences. Clear writing makes clear speaking."],["Practise aloud","Say it aloud twice, once alone and once to someone you trust. The words feel easier the second time."],["Plan for hard moments","Decide what you will say if the other person gets upset or changes the topic, such as ‘I hear you, and I would like to finish my point.’"],["Review afterward","Afterward write what went well and what you would change. Every conversation builds your skill."]]],
X:[["Opening","‘Can we talk about something that matters to me? I want us to understand each other.’"],["When you disagree","‘I see it differently, and I would like to explain how.’"],["When you need a pause","‘I want to answer carefully. Can we continue in ten minutes?’"],["Saying no kindly","‘Thank you for asking. I am not able to do that.’"]],
W:["Using ‘you always’ or ‘you never’","Starting when you are angry","Trying to win instead of trying to understand","If you feel unsafe with someone, do not confront them. Speak to a trusted person or local support services."]},
5:{n:"Wellbeing Coach",tx:"Describe what is happening in one or two sentences (no names, please)",xh:"Quick tools",d:"LifeHelper gives general wellbeing education only. It cannot diagnose or treat any health condition. For medical or mental health concerns, please see a doctor, nurse or counsellor.",
AP:["Small steady routine","Calming tools","Support and connection"],
q:[["What would you like help with?",["Sleeping better","Handling stress","Building healthy daily habits","Feeling more motivated","Managing screen time"]],["How long has this been going on?",["A few days","A few weeks","A long time"]],["How much does it affect your daily life?",["A little","Quite a lot","A great deal"]],["What would help most?",["A simple routine","Calming techniques","Ways to talk to someone","All of these"]]],
S:[["Sleep is trained by routine, so a regular bedtime and a calm hour before bed help your body learn when to rest.","Stress is the body’s alarm. Slow breathing, writing worries down and doing one small thing can calm it.","Healthy habits are built from small repeated choices such as water, movement, regular meals and rest.","Motivation often follows action, so the plan starts with very small steps.","Screen time becomes easier to manage when you notice it, set a limit and replace it with something specific."],
["Over a few days this is often a short-term pattern, and simple habits can help.","Over a few weeks, keep gentle routines going and talk to someone you trust.","If it has lasted a long time, please speak to a doctor, nurse or counsellor, as well as using these steps."],
["If it affects you a little, small changes can make a real difference.","If it affects you quite a lot, use these steps and also speak to someone you trust, such as a family member, teacher or health worker.","If it affects you a great deal, please contact a doctor, nurse or counsellor soon. You deserve proper support."],
["A simple routine gives your body and mind a steady rhythm.","Calming techniques give you quick tools for hard moments.","Talking to someone is one of the strongest ways to feel better, and the plan includes ideas for how to start.","A mix of routine, calming tools and talking to someone gives you the strongest support."]],
K:["Sleep: keep the same bedtime and wake-up time, avoid heavy meals, caffeine and screens before bed, keep the room dark and quiet, and get daylight in the morning. If you lie awake for a long time, get up and do something calm until you feel sleepy.","Stress: notice early signs in your body, breathe slowly (in for 4, out for 6), write your worries and sort them into ‘I can act’ and ‘I cannot control’, take a short walk, and do one small thing from the first list.","Daily habits: choose water, movement, regular meals and rest. Pick one habit, make it very small, and attach it to something you already do each day.","Motivation: start with a five-minute version of the task, since feelings often follow action. Set a small goal, tell someone, and reward yourself for finishing.","Screen time: notice how much time you spend and how you feel afterward. Set a clear limit, keep the phone out of the bedroom, and replace some screen time with a specific alternative such as a walk or a call."],
P:[[["Notice the pattern","For three days write down when this is worst and what is around it. Patterns show what to change."],["Change one thing","Choose one change only, such as a fixed bedtime or five slow breaths. One change you keep beats five you drop."],["Make it easy","Prepare the night before and remove obstacles. A routine that is easy to start is much easier to keep."],["Review after a week","Ask what changed and what to adjust. Small improvements count."]],
[["Slow breathing","Breathe in for 4 and out for 6, five times, whenever it feels strong. Slow outbreaths tell the body it is safe."],["Write it out","Write what is on your mind for five minutes, then underline what you can act on. Seeing it on paper makes it smaller."],["Move gently","Take a ten-minute walk or stretch. Movement helps the body release tension."],["Ground yourself","Name five things you can see and three you can hear. This brings your attention back to the present."]],
[["Choose a person","Think of someone you trust, such as a family member, friend, teacher, community leader or health worker."],["Say it simply","You might say: ‘I have been finding this hard lately and I would like to talk.’ You do not have to explain everything."],["Ask for what helps","Say whether you want advice, someone to listen, or help with a task. People help better when they know what you need."],["Consider a professional","A doctor, nurse or counsellor can give proper support, especially if things have lasted a long time or affect daily life."]]],
X:[["Breathing","In through the nose for 4 seconds, out slowly for 6 seconds. Repeat five times."],["Worry list","Make two columns: ‘I can act’ and ‘I cannot control’. Do one small thing from the first column today."],["Evening wind-down","Thirty minutes before bed, dim the lights, put the phone away and do something calm."]],
W:["Trying to change everything at once","Staying silent when you need help","Using screens or caffeine late in the day","If you ever feel unsafe or think about harming yourself, contact your local emergency number or a trusted person right away. You do not have to carry it alone."]},
6:{n:"Trusted Services Coach",tx:"What do you need, and in which country? (No ID numbers or personal details)",xh:"Scam checks",d:"LifeHelper has not yet reviewed country-specific listings, so none are shown. Always confirm details with the official source.",
AP:["Verify first","Prepare to apply","Ask people and compare"],
q:[["What are you looking for?",["Official government help or documents","A scholarship or training","Health or social support","Support for a small business","A safe opportunity or job lead"]],["What worries you most?",["Finding the right place","Being scammed","Not knowing how to apply","Not having the right documents"]],["How urgent is it?",["Urgent, within days","Within a few weeks","No rush"]],["How comfortable are you with online forms?",["Not comfortable","A little","Comfortable"]]],
S:[["Official services are best found on the website of the government body itself, or through its office in person.","Real scholarships and training programmes publish clear rules, deadlines and contacts, and they do not ask for payment to apply.","Health and social support is best found through recognised clinics, hospitals and registered organisations. In an emergency, contact local emergency services.","Business support comes from official small-business agencies, recognised banks and microfinance institutions, and established business associations.","A safe opportunity has a named organisation, clear requirements and a contact you can verify."],
["To find the right place, search the official name and read its About and Contact pages.","To avoid scams, never pay to apply, never share ID or bank details early, and be careful when you are rushed.","To apply, read the instructions twice, make a checklist of documents, and ask someone to review your application.","For documents, list what is required and check whether the office accepts copies or needs originals."],
["Because it is urgent, start today and go to the official office or phone line for the exact steps.","Within a few weeks you have time to check carefully and prepare your documents properly.","With no rush, take time to compare options and confirm everything."],
["If you are not comfortable with online forms, ask a trusted person to sit with you, or go to the office in person.","With some online experience, take your time, save each page and write down reference numbers.","Even if you are comfortable online, verify website addresses carefully, because lookalike sites exist."]],
K:["Government help: find the ministry or agency on its official website, check the web address, and look for a contact page and an office address. Many services also have offices where staff can explain the steps.","Scholarships and training: look for the organisation’s own page, clear eligibility rules, a deadline and a free application. Be careful of sites that ask for a fee, promise guaranteed success, or only use messaging apps.","Health and social support: choose recognised clinics, hospitals or registered organisations. Ask what they offer and what it costs before you go, and bring any documents you have.","Small business support: look for government small-business agencies, recognised banks and microfinance institutions, and business associations. Compare costs and terms in writing before you agree.","Safe opportunities: confirm that the organisation exists, find its official website and phone number, and be cautious if the contact only uses a free email address or messaging app. A genuine employer does not ask for money to give you a job."],
P:[[["Write what you need","Describe exactly what you need and in which country: {T}. A clear need leads to better results."],["Find the official source","Search for the organisation’s own website and check the address carefully. Beware of lookalike names."],["Check it is genuine","Look for a real address, phone number and clear rules. If anyone asks for money or secrecy, stop and ask a trusted adult."],["Contact and record","Use the official contact to confirm the details, and save names, dates and reference numbers in the Jobs & Opportunities tool."]],
[["List the requirements","Write down everything required for {T}: documents, deadlines, fees (there should be none for scholarships and jobs) and contacts."],["Gather your documents","Collect copies and keep the originals safe. Check which documents need to be certified."],["Draft your application","Write your answers in a separate document first, check them, then copy them into the form."],["Submit and follow up","Submit before the deadline, keep proof, and follow up politely after a week."]],
[["Ask trusted people","Ask family, teachers or community leaders whether they know the service for {T} and what their experience was."],["Compare two or three options","Write down what each offers, what it costs and what it requires. Choose using facts, not pressure."],["Visit or call","If possible, go in person or call an official number. Ask for the steps in writing."],["Keep a safe record","Keep receipts and messages. Report any suspicious request for payment to the authorities or a trusted person."]]],
X:[["Is money requested?","Real jobs, scholarships and public services do not ask you to pay to be selected."],["Is it urgent or secret?","Scammers rush you or tell you to keep things quiet. Stop and ask someone you trust."],["Does the address match?","Check the exact web address and look for spelling tricks. Type the address yourself instead of clicking links in messages."]],
W:["Paying to apply for a job or scholarship","Sharing passwords, PINs or bank details","Trusting messages that rush you or promise guaranteed results","LifeHelper has not yet reviewed country-specific listings, so none are shown. Always confirm details with the official source."]}};
