<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeHelper</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F4;--sf:#fff;--ink:#1B2A2A;--mut:#5A6B6B;--pri:#0F5C5C;--on:#fff;--acc:#F2A93B;--ln:#D5DED9;--sg:#E3EDE8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A1A;--sf:#182424;--ink:#EAF2EE;--mut:#9DB1AB;--pri:#5CC4B8;--on:#0B1717;--acc:#F2B857;--ln:#2C3E3C;--sg:#1F3330}}
:root[data-theme="dark"]{--bg:#101A1A;--sf:#182424;--ink:#EAF2EE;--mut:#9DB1AB;--pri:#5CC4B8;--on:#0B1717;--acc:#F2B857;--ln:#2C3E3C;--sg:#1F3330}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5em;margin:0 0 4px}h2{font-size:1.2em;margin:20px 0 8px}h3{font-size:1.05em;margin:0}
p{margin:6px 0}.mut{color:var(--mut);font-size:.9em}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:12px;padding:14px 18px;font-weight:700;width:100%;min-height:48px;cursor:pointer}
.btn.s{background:var(--sg);color:var(--ink);width:auto;padding:10px 14px;min-height:44px}
.btn.big{font-size:1.15em;padding:18px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3em}
.mark{width:40px;height:40px;border-radius:12px;background:var(--pri);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:14px 12px;text-align:left;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:.95em}.tile span{font-size:1.5em}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:0 0 auto}.row>.g{flex:1 1 auto;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:11px;min-height:46px}
textarea{min-height:96px}
label{display:block;font-weight:700;margin:10px 0 4px}
.bar{height:10px;background:var(--sg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
.item input[type=checkbox]{width:26px;height:26px;margin-top:2px;accent-color:var(--pri)}
.done{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:1.3em;min-width:44px;min-height:44px;cursor:pointer}
.note{border-left:5px solid var(--acc);background:var(--sg);padding:10px 12px;border-radius:8px;font-size:.92em}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 2px;min-height:60px;font-size:.78em;cursor:pointer;color:var(--mut)}
nav button span{display:block;font-size:1.5em;line-height:1.2}
nav button[aria-current=page]{color:var(--pri);font-weight:700}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 0;min-height:44px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:14px;margin:8px 0;min-height:48px;cursor:pointer}
@media print{nav,.back,.btn,.row{display:none!important}body{padding:0}}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F5C5C"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><main id="app"></main><nav id="nav" aria-label="Main"></nav>
<script>
const C=[["💼","Work, Jobs & Career"],["💰","Budgeting & Money"],["🗓️","Daily Planning & Goals"],["📚","Learning Practical Skills"],["💬","Communication"],["🌿","Wellbeing & Habits"],["🧭","Trusted Services"]];
const Q=["What do you need most?"];
const G=[
{c:0,t:"Prepare a simple CV",k:"cv resume résumé",s:["List your contact details, then 2–3 lines about who you are and what you offer.","Write your work or volunteer experience, newest first, using action words.","Add education, training and skills that match the job.","Ask someone you trust to check spelling.","Save it as PDF and name it clearly."],n:"Tailor the CV for each job."},
{c:0,t:"Prepare for an interview",k:"interview",s:["Read the job advert and note what they ask for.","Prepare short examples of times you did those things.","Practise answering ‘Tell me about yourself’ aloud.","Prepare two questions to ask them.","Plan your route and arrive early."],n:"Honest, clear answers matter more than perfect ones."},
{c:1,t:"Make a simple monthly budget",k:"budget money spend save",s:["Write your total income for the month.","List fixed costs: rent, transport, food, bills.","List flexible costs and what you can reduce.","Set a small savings amount first, even if tiny.","Record spending in the Budget tool and review weekly."],n:"General budgeting information only, not financial advice."},
{c:1,t:"Start a savings goal",k:"saving savings goal",s:["Name the goal and the amount needed.","Choose a date and divide the amount by the weeks left.","Set the weekly amount aside as soon as money comes in.","Track progress each week."],n:"General information only, not financial advice."},
{c:2,t:"Plan your day",k:"plan day routine organize organise time",s:["Write everything you need to do today.","Pick the 3 most important tasks.","Give each a time slot.","Do the hardest task first.","Review what is unfinished tonight."],n:"Use the Daily Tasks tool to keep the list."},
{c:2,t:"Build a new habit",k:"habit goal routine",s:["Choose one small habit (2 minutes to start).","Attach it to something you already do daily.","Mark each day you do it.","If you miss a day, restart the next day."],n:"Consistency beats intensity."},
{c:3,t:"Learn a new skill",k:"learn study skill course",s:["Define the skill and why you want it.","Find 1–2 trusted free resources.","Schedule short practice sessions.","Practise by making something small.","Review progress every week."],n:"Use the Learning Planner tool."},
{c:3,t:"Study for an exam",k:"exam study test revision",s:["List topics and mark the ones you find hardest.","Make a timetable until the exam date.","Study in 25-minute blocks with short breaks.","Test yourself with past questions.","Sleep well before the exam."],n:""},
{c:4,t:"Have a difficult conversation",k:"conflict argue difficult conversation misunderstanding",s:["Decide what outcome you want.","Choose a calm, private moment.","Describe the situation and how you feel, without blaming.","Listen without interrupting.","Agree on one clear next step."],n:"Be respectful and open to cultural differences."},
{c:4,t:"Build speaking confidence",k:"confidence shy speak",s:["Start with short chats with people you trust.","Prepare one or two opening sentences.","Practise breathing slowly before speaking.","Celebrate small wins."],n:""},
{c:5,t:"Create a better sleep routine",k:"sleep tired rest",s:["Pick a regular bedtime and wake time.","Avoid screens for 30 minutes before bed.","Keep the room dark and quiet.","Limit caffeine late in the day."],n:"General education only. See a health professional if problems continue."},
{c:5,t:"Handle everyday stress",k:"stress anxious worried pressure",s:["Notice the stress and name it.","Breathe in for 4, out for 6, five times.","Write down what is in your control.","Take one small action.","Talk to someone you trust."],n:"If you feel unsafe or overwhelmed, contact a doctor, counsellor or local emergency services."},
{c:6,t:"Find official help and services",k:"service government help support",s:["Write what you need help with.","Search for your government’s official website (look for .gov or your national domain).","Prefer official or well-known organisations.","Never pay someone who promises guaranteed results.","Save what you find in the Jobs & Opportunities tool."],n:"LifeHelper has not yet reviewed country-specific listings, so none are shown. We never invent services."},
{c:6,t:"Check if an opportunity is genuine",k:"job scam fake offer opportunity",s:["Check the organisation’s official website.","Be careful if you must pay to apply.","Do not share ID or bank details early.","Ask a trusted person.","Report suspicious offers."],n:""}];
const T={task:{n:"Daily Tasks",i:"✅",ph:"New task",x:"date"},goal:{n:"Goals & Habits",i:"🎯",ph:"New goal or habit"},learn:{n:"Learning Planner",i:"📘",ph:"Lesson or practice"},check:{n:"Checklists",i:"📝",ph:"Checklist item"},job:{n:"Jobs & Opportunities",i:"🔎",ph:"Opportunity",x:"date"}};
const ST=["Saved","Applied","Interview","Offer","Closed"];
let S={fs:1,plans:[],L:{task:[],goal:[],learn:[],check:[],job:[]},tx:[]},tab="home",v=null;
try{const r=localStorage.getItem("lh1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const sv=()=>{try{localStorage.setItem("lh1",JSON.stringify(S))}catch(e){}};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=a=>a.length?Math.round(a.filter(x=>x.d).length/a.length*100):0;
const bar=p=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><p class="mut">${p}% complete</p>`;
const go=(t,x)=>{tab=t;v=x||null;R();scrollTo(0,0)};
function R(){document.documentElement.style.fontSize=[15,17,20][S.fs]+"px";
const N=[["home","🏠","Home"],["tools","🧰","Tools"],["learn","🎓","Learning"],["saved","📌","Saved"],["set","⚙️","Settings"]];
nav.innerHTML=N.map(n=>`<button ${tab==n[0]?'aria-current="page"':''} onclick="go('${n[0]}')"><span aria-hidden="true">${n[1]}</span>${n[2]}</button>`).join("");
app.innerHTML=({home:H,tools:TL,learn:LN,saved:SV,set:SE})[tab]()}
function H(){
if(v&&v.m=="g")return Gd(v.i);
if(v&&v.m=="cat")return Cat(v.i);
if(v&&v.m=="res")return Res(v.r,v.q);
if(v&&v.m=="desc")return Desc();
return `<div class="brand"><div class="logo"><div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M5 14l5 5L21 7" fill="none" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>LifeHelper</div>
<label class="mut" style="margin:0">Language<select aria-label="Language" onchange="if(this.value!='en')alert('Only English is ready. Translations will be added after they are reviewed.');this.value='en'"><option value="en">English</option><option>Français</option><option>Português</option><option>Español</option><option>العربية</option><option>Yorùbá</option><option>Hausa</option><option>Igbo</option></select></label></div>
<h1 style="margin-top:18px">Everyday help, step by step.</h1><p class="mut">No account needed. Your information stays on this device.</p>
<button class="btn big" onclick="go('home',{m:'desc'})">Solve My Problem</button>
<h2>Or choose a category</h2><div class="grid">${C.map((c,i)=>`<button class="tile" onclick="go('home',{m:'cat',i:${i}})"><span aria-hidden="true">${c[0]}</span><b>${c[1]}</b></button>`).join("")}</div>`}
function Desc(){return `<button class="back" onclick="go('home')">← Back</button><h1>Describe your problem</h1><label for="d">Tell us in your own words</label><textarea id="d" placeholder="Example: I need to prepare for a job interview"></textarea><div style="height:10px"></div><button class="btn" onclick="Match()">Find guidance</button>`}
function Match(){const q=d.value.toLowerCase().trim();
if(/suicid|kill myself|abuse|violence|emergency|overdose|attack/.test(q))return go('home',{m:'res',r:[],q:'urgent'});
const w=q.split(/\W+/).filter(x=>x.length>2);
const sc=G.map((g,i)=>[w.filter(x=>(g.k+" "+g.t).toLowerCase().includes(x)).length,i]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
go('home',{m:'res',r:sc.slice(0,3).map(x=>x[1]),q})}
function Res(r,q){const b=`<button class="back" onclick="go('home',{m:'desc'})">← Back</button>`;
if(q=='urgent')return b+`<h1>Please get help now</h1><div class="note"><p>If you or someone else is in danger or having a medical emergency, contact your local emergency number or go to the nearest hospital now. Reach out to someone you trust to stay with you.</p><p>LifeHelper gives general information only and cannot handle emergencies.</p></div>`;
if(!r.length)return b+`<h1>No confident match</h1><p>We could not match this to a reviewed guide, and we will not guess. Try different words, or choose a category.</p><button class="btn" onclick="go('home')">Choose a category</button>`;
return b+`<h1>Possible guides</h1><p class="mut">Pick the one that fits best.</p>`+r.map(i=>`<button class="opt" onclick="go('home',{m:'g',i:${i}})"><b>${G[i].t}</b><br><span class="mut">${C[G[i].c][1]}</span></button>`).join("")}
function Cat(i){return `<button class="back" onclick="go('home')">← Back</button><h1>${C[i][0]} ${C[i][1]}</h1><p>${Q[0]}</p>`+G.map((g,j)=>g.c==i?`<button class="opt" onclick="go('home',{m:'g',i:${j}})">${g.t}</button>`:"").join("")+(i==6?`<div class="note">Country-specific services are not shown yet because they have not been reviewed. We never invent listings.</div>`:"")}
function Gd(i){const g=G[i];return `<button class="back" onclick="go('${tab}')">← Back</button><h1>${g.t}</h1><p class="mut">${C[g.c][1]}</p><div class="card"><ol style="padding-left:20px;margin:0">${g.s.map(s=>`<li style="margin:8px 0">${E(s)}</li>`).join("")}</ol></div>${g.n?`<div class="note">${g.n}</div>`:""}<div style="height:12px"></div><button class="btn" onclick="SavePlan(${i})">Save this plan</button><div style="height:8px"></div><button class="btn s" style="width:100%" onclick="print()">Save as PDF / print</button><p class="mut">General educational guidance, not professional advice.</p>`}
function SavePlan(i){const g=G[i];S.plans.unshift({id:Date.now(),t:g.t,s:g.s.map(t=>({t,d:0}))});sv();go('saved')}
function TL(){
if(v=="budget")return Bu();if(v=="lock")return `<button class="back" onclick="go('tools')">← Tools</button><h1>📄 CV Builder</h1><div class="note">The CV Builder is a Premium feature. Premium members answer simple questions and get a finished CV they can save as PDF.</div><div style="height:12px"></div><button class="btn" onclick="go('set')">See Premium in Settings</button><p class="mut">Free: the Prepare a simple CV guide, with Save as PDF.</p>`;if(v=="cv")return CVf();if(v=="cvv")return CVp();
if(v)return Li(v);
return `<h1>Tools</h1><p class="mut">Saved on this device. Works without internet once loaded.</p>`+Object.keys(T).map(k=>`<button class="opt" onclick="go('tools','${k}')"><span aria-hidden="true">${T[k].i}</span> <b>${T[k].n}</b><br><span class="mut">${pct(S.L[k])}% done · ${S.L[k].length} items</span></button>`).join("")+`<button class="opt" onclick="go('tools','budget')"><span aria-hidden="true">💵</span> <b>Budget & Expenses</b><br><span class="mut">${S.tx.length} records</span></button><button class="opt" onclick="CVo()"><span aria-hidden="true">📄</span> <b>CV Builder (Premium)</b><br><span class="mut">Make a real CV and save it as PDF</span></button>`}
function Li(k){const t=T[k],a=S.L[k];return `<button class="back" onclick="go('tools')">← Tools</button><h1>${t.n}</h1>${bar(pct(a))}<div class="row"><div class="g"><input type="text" id="ni" aria-label="${t.ph}" placeholder="${t.ph}"></div>${t.x?`<div><input type="date" id="nd" aria-label="Due date"></div>`:""}</div><div style="height:8px"></div><button class="btn" onclick="Add('${k}')">Add</button>`+(a.length?a.map((x,i)=>`<div class="item"><input type="checkbox" aria-label="Done" ${x.d?"checked":""} onchange="Tg('${k}',${i})"><div class="g"><span class="${x.d?'done':''}">${E(x.t)}</span>${x.x?`<div class="mut">Due ${E(x.x)}</div>`:""}${k=="job"?`<button class="btn s" onclick="Stt(${i})">Status: ${ST[x.st||0]}</button>`:""}</div><button class="x" aria-label="Delete" onclick="Dl('${k}',${i})">✕</button></div>`).join(""):`<p class="mut">Nothing here yet. Add your first item above.</p>`)}
const Add=k=>{const t=ni.value.trim();if(!t){ni.focus();return}S.L[k].push({t,d:0,x:window.nd?nd.value:"",st:0});sv();R()};
const Tg=(k,i)=>{S.L[k][i].d^=1;sv();R()},Dl=(k,i)=>{S.L[k].splice(i,1);sv();R()},Stt=i=>{S.L.job[i].st=((S.L.job[i].st||0)+1)%5;sv();R()};
async function CVo(){if(!A){AM="Log in first (Settings > Account). The CV Builder is for Premium members.";return go('set')}
try{const j=await rq("/rest/v1/profiles?select=is_premium,premium_until",{},1),r=j[0],ok=r&&r.is_premium&&(!r.premium_until||new Date(r.premium_until)>new Date());go('tools',ok?'cv':'lock')}catch(x){AM="Could not check Premium: "+x.message;go('set')}}
const CF=[["n","Full name"],["p","Phone"],["e","Email"],["l","Town, Country"],["j","Job you want"]];
function CVf(){const c=S.cv||{};return `<button class="back" onclick="go('tools')">← Tools</button><h1>CV Builder</h1><p class="mut">Fill in what you can. Tap Make my CV, then Save as PDF / print.</p>`+CF.map(f=>`<label for="c_${f[0]}">${f[1]}</label><input type="text" id="c_${f[0]}" value="${E(c[f[0]]||"")}">`).join("")+`<label for="c_s">About you (2 lines)</label><textarea id="c_s">${E(c.s||"")}</textarea><label for="c_x">Experience (one per line: Role, Place, Dates: what you did)</label><textarea id="c_x">${E(c.x||"")}</textarea><label for="c_k">Skills (separate with commas)</label><input type="text" id="c_k" value="${E(c.k||"")}"><label for="c_d">Education and training (one per line)</label><textarea id="c_d">${E(c.d||"")}</textarea><div style="height:12px"></div><button class="btn" onclick="CVm()">Make my CV</button>`}
function CVm(){const c={};["n","p","e","l","j","s","x","k","d"].forEach(k=>c[k]=document.getElementById("c_"+k).value.trim());S.cv=c;sv();go('tools','cvv')}
function CVp(){const c=S.cv||{},L=t=>(t||"").split("\n").map(x=>x.trim()).filter(x=>x),ul=a=>a.length?`<ul>${a.map(x=>`<li>${E(x)}</li>`).join("")}</ul>`:"",sec=(h,b)=>b?`<h3 style="border-bottom:2px solid #0F5C5C;margin-top:16px">${h}</h3>${b}`:"";
return `<button class="back" onclick="go('tools','cv')">← Edit</button><div class="card" style="background:#fff;color:#111"><h1 style="margin:0">${E(c.n||"Your name")}</h1><p>${[c.p,c.e,c.l].filter(x=>x).map(E).join(" | ")}</p>${c.j?`<p><b>${E(c.j)}</b></p>`:""}${sec("About me",c.s?`<p>${E(c.s)}</p>`:"")}${sec("Experience",ul(L(c.x)))}${sec("Skills",c.k?`<p>${E(c.k)}</p>`:"")}${sec("Education and training",ul(L(c.d)))}</div><button class="btn" onclick="print()">Save as PDF / print</button><p class="mut">Tip: in the print window, choose "Save as PDF".</p>`}
function Bu(){const inc=S.tx.filter(x=>x.a>0).reduce((s,x)=>s+x.a,0),out=-S.tx.filter(x=>x.a<0).reduce((s,x)=>s+x.a,0);
return `<button class="back" onclick="go('tools')">← Tools</button><h1>Budget & Expenses</h1><div class="card"><div class="row"><div class="g">Received<br><b>${inc.toFixed(2)}</b></div><div class="g">Spent<br><b>${out.toFixed(2)}</b></div><div class="g">Balance<br><b>${(inc-out).toFixed(2)}</b></div></div></div>
<label for="ba">Amount</label><input type="number" id="ba" inputmode="decimal" min="0" step="0.01"><label for="bc">Category</label><select id="bc">${["Food","Transport","Bills","Housing","Savings","Other"].map(x=>`<option>${x}</option>`).join("")}</select>
<div class="row" style="margin-top:12px"><button class="btn" onclick="Tx(1)">Money in</button><button class="btn" style="background:var(--acc);color:#1B2A2A" onclick="Tx(-1)">Money out</button></div>`+S.tx.map((x,i)=>`<div class="item"><div class="g">${E(x.c)}<div class="mut">${x.dt}</div></div><b>${x.a>0?"+":""}${x.a.toFixed(2)}</b><button class="x" aria-label="Delete" onclick="S.tx.splice(${i},1);sv();R()">✕</button></div>`).join("")+`<p class="mut">General tool, not financial advice. Use your own currency.</p>`}
function Tx(s){const a=parseFloat(ba.value);if(!(a>0)){ba.focus();return}S.tx.unshift({a:a*s,c:bc.value,dt:new Date().toLocaleDateString()});sv();R()}
let PD=null,PM="";
async function PLo(){if(!A){AM="Log in first (Settings > Account), then open the Premium library.";go('set');return}try{PM="";const j=await rq("/rest/v1/premium_content?select=id,kind,category,title,body&order=sort",{},1);PD=j;PM=j.length?"":"The Premium library is for Premium members. Open Settings and tap Check status."}catch(x){PM="Could not load: "+x.message}go('learn',{m:'prem'})}
function PLib(){if(v.i!=null&&PD&&PD[v.i]){const p=PD[v.i];return `<button class="back" onclick="go('learn',{m:'prem'})">← Premium library</button><h1>${E(p.title)}</h1><p class="mut">${E(p.category)}</p><div class="card" style="white-space:pre-wrap">${E(p.body)}</div><div class="row" style="flex-wrap:wrap"><button class="btn s" onclick="print()">Save as PDF / print</button><button class="btn s" onclick="SaveP(${v.i})">Save as plan</button></div><p class="mut">General educational guidance, not professional advice.</p>`}
