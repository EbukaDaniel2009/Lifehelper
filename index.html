*{box-sizing:border-box}

main{max-width:640px;margin:0 auto;padding:16px}

p{margin:6px 0}.mut{color:var(--mut);font-size:.9em}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:12px;padding:14px 18px;font-weight:700;width:100%;min-height:48px;cursor:pointer}
.btn.s{background:var(--sg);color:var(--ink);width:auto;padding:10px 14px;min-height:44px}
.btn.big{font-size:1.15em;padding:18px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3em}
.mark{width:40px;height:40px;border-radius:12px;background:var(--pri);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:14px 12px;text-align:left;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:.95em}.tile span{font-size:1.5em}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:0 0 auto}.row>.g{flex:1 1 auto;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:11px;min-height:46px}
textarea{min-height:96px}
label{display:block;font-weight:700;margin:10px 0 4px}
.bar{height:10px;background:var(--sg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
.item input[type=checkbox]{width:26px;height:26px;margin-top:2px;accent-color:var(--pri)}
.done{text-decoration:line-through;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);font-size:1.3em;min-width:44px;min-height:44px;cursor:pointer}
.note{border-left:5px solid var(--acc);background:var(--sg);padding:10px 12px;border-radius:8px;font-size:.92em}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 2px;min-height:60px;font-size:.78em;cursor:pointer;color:var(--mut)}
nav button span{display:block;font-size:1.5em;line-height:1.2}
nav button[aria-current=page]{color:var(--pri);font-weight:700}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 0;min-height:44px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:14px;margin:8px 0;min-height:48px;cursor:pointer}
@media print{.np{display:none!important}nav,.back,.btn,.row{display:none!important}body{padding:0;background:#fff!important;color:#000!important}.card,.note,.opt{background:#fff!important;color:#000!important;border-color:#999!important}h1,h2,h3,p,li,span,label{color:#000!important}}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F5C5C"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><main id="app"></main><nav id="nav" aria-label="Main"></nav>

{c:0,t:"Prepare a simple CV",k:"cv resume résumé",s:["List your contact details, then 2–3 lines about who you are and what you offer.","Write your work or volunteer experience, newest first, using action words.","Add education, training and skills that match the job.","Ask someone you trust to check spelling.","Save it as PDF and name it clearly."],n:"Tailor the CV for each job."},

{c:2,t:"Build a new habit",k:"habit goal routine",s:["Choose one small habit (2 minutes to start).","Attach it to something you already do daily.","Mark each day you do it.","If you miss a day, restart the next day."],n:"Consistency beats intensity."},

nav.innerHTML=N.map(n=>`<button ${tab==n[0]?'aria-current="page"':''} onclick="go('${n[0]}')"><span aria-hidden="true">${n[1]}</span>${n[2]}</button>`).join("");
app.innerHTML=({home:H,tools:TL,learn:LN,saved:SV,set:SE})[tab]()}

if(v&&v.m=="wq")return WQv();if(v&&v.m=="wr")return WQp();if(v&&v.m=="wql")return `<button class="back" onclick="go('home',{m:'cat',i:0})">← Back</button><h1>⭐ Job Coach</h1><div class="note">The Job Coach is a Premium feature. It asks about the job you want and your situation, then writes a detailed plan and offers other approaches.</div><div style="height:12px"></div><button class="btn" onclick="go('set')">See Premium in Settings</button>`;

<label class="mut" style="margin:0">Language<select aria-label="Language" onchange="if(this.value!='en')alert('Only English is ready. Translations will be added after they are reviewed.');this.value='en'"><option value="en">English</option><option>Français</option><option>Português</option><option>Español</option><option>العربية</option><option>Yorùbá</option><option>Hausa</option><option>Igbo</option></select></label></div>
<h1 style="margin-top:18px">Everyday help, step by step.</h1><p class="mut">No account needed. Your information stays on this device.</p>
<button class="btn big" onclick="go('home',{m:'desc'})">Solve My Problem</button>

function Match(){const q=d.value.toLowerCase().trim();

const sc=CK.map((re,i)=>[(q.match(new RegExp(re.source,"g"))||[]).length,i]).sort((a,b)=>b[0]-a[0]);

DQ={c:sc[0][1],a:[null,null],t:d.value.trim()};go('home',{m:'dq'})}

if(!r.length)return b+`<h1>No confident match</h1><p>We could not match this to a reviewed guide, and we will not guess. Try different words, or choose a category.</p><button class="btn" onclick="go('home')">Choose a category</button>`;
return b+`<h1>Possible guides</h1><p class="mut">Pick the one that fits best.</p>`+r.map(i=>`<button class="opt" onclick="go('home',{m:'g',i:${i}})"><b>${G[i].t}</b><br><span class="mut">${C[G[i].c][1]}</span></button>`).join("")}
const D=[
{q:[["What do you need help with?",["Writing or improving my CV","Preparing for an interview","Finding and tracking job applications"]],["Where are you now?",["I have never had a job","I have some experience","I want to change career"]]],
t:[["A CV is a short advert for you. Its only job is to get you an interview, so every line should help the employer see why you fit the role.","An interview is a conversation, not a test. Employers want to see that you are honest, prepared and easy to work with.","Job hunting works best as a routine. A few careful applications beat the same message sent everywhere."],["Having no job history is fine. Use school work, volunteering, church or community tasks, and helping at home or in a family business as real evidence of your skills.","With some experience, focus on results: what changed because of your work, with a number if you honestly can.","When changing career, show the skills that carry over, such as communication, reliability and problem solving, and explain simply why you are making the move."]],
s:[["Choose one clear target","Pick one kind of job to aim at first. A clear target lets you choose the right words, skills and examples, instead of writing something vague that fits nothing."],["Collect your evidence","Write down 5 things you have done well, with what you did and what happened. These become your CV points and your interview stories."],["Write or practise with that evidence","Use short sentences that begin with action words such as organised, taught, repaired or sold. Read your CV aloud, or practise answers aloud, until it sounds natural and honest."],["Check, then act","Ask someone you trust to check spelling and clarity. Then apply, and note the date and deadline in the Jobs tool so nothing is missed."]],
x:["Using one CV for every job","Saying things that are not true, because employers check","Paying anyone for a job offer. Real employers do not ask for this"]},
{q:[["What do you want to do?",["Make a monthly budget","Start saving","Control my spending"]],["How does your money come in?",["The same amount each month","It changes from month to month","I have little or no income now"]]],
t:[["A budget is a plan for your money before the month starts. It gives every coin and note a job.","Saving works best when it is automatic and small. The habit matters more than the amount at the start.","Controlling spending starts with seeing where money goes. Most people find two or three small leaks."],["With steady income you can plan the whole month and set fixed amounts for each need.","With changing income, plan using your lowest usual month and treat extra money as a bonus for savings.","With little income, put essentials first and write down every spend. Small, honest records show what can wait."]],
s:[["Know what comes in","Write your income for the month. If it changes, use the lowest amount you usually receive, so you are never caught short."],["List what you must pay","Rent, transport, food, data, school and bills come first. These cannot be skipped, so they are protected before anything else."],["Set aside savings first","Choose a small amount and move it as soon as money arrives. Saving what is left over rarely works, because it is usually nothing."],["Record and review","Use the Budget tool for two weeks and look at the two biggest leaks. A short weekly review keeps the plan alive."]],
x:["Forgetting irregular costs such as repairs and events","Having no small emergency pot","Tracking only big purchases, not small daily ones"]},
{q:[["What do you want?",["Plan my day","Reach a goal","Build a habit"]],["What gets in the way?",["Too many things to do","I keep putting things off","I forget and lose track"]]],
t:[["A good day plan is short. Three important tasks finished is better than ten tasks half done.","A goal needs a finish line and a first step you can do this week.","Habits grow from tiny actions repeated daily and tied to something you already do."],["When everything feels urgent, choose the three tasks that matter most and let the rest wait.","Putting things off usually means the task feels too big. Break it down until the first step takes under five minutes.","If you forget, keep tasks in one place and set a reminder for the time you will do them."]],
s:[["Write it all down","Get everything out of your head and onto a list. A written list lowers stress and shows you what is real."],["Pick what matters","Choose the three most important items and give each a time. What has a time is more likely to happen."],["Start small","Begin with the easiest first step. Starting is the hardest part, and momentum follows."],["Review and adjust","At the end of the day tick what is done and move the rest. Treat a missed day as information, not failure."]],
x:["Planning too much for one day","Waiting to feel motivated before starting","Quitting a habit after one missed day"]},
{q:[["What are you doing?",["Learning a new skill","Studying for an exam","Making a study plan"]],["How much time do you have?",["Less than 30 minutes a day","About one hour a day","Several hours a day"]]],
t:[["Skills are built by practising, not only reading. Aim to make something small early.","Exams reward recall. The best revision is testing yourself, not rereading notes.","A study plan turns a big subject into small daily pieces you can finish."],["With under 30 minutes, study one topic with full attention and no phone.","With an hour, use two blocks of 25 minutes with a short break between them.","With several hours, mix subjects and take proper breaks, because tired study is wasted study."]],
s:[["Define the target","Write exactly what you must know or do, and by when. A clear target stops you studying everything and finishing nothing."],["Break it into topics","List the topics and mark the ones you find hardest. Start with the hard ones while your energy is fresh."],["Learn, then test yourself","After each topic, close the book and write what you remember. Finding what you forgot is where most learning happens."],["Review on a schedule","Revisit each topic after a day, after a week, and before the exam. Repeating over time makes memory last."]],
x:["Rereading without testing yourself","Studying late and sleeping badly","Leaving the hardest topic until last"]},
{q:[["What is the situation?",["A difficult conversation","A misunderstanding with someone","Speaking with more confidence"]],["Who is it with?",["Family or a close friend","Someone at work or school","Someone I do not know well"]]],
t:[["A difficult conversation goes better when you know the one outcome you want and stay calm.","Most misunderstandings come from different assumptions. Asking questions often clears them quickly.","Confidence is a skill. It grows from small practice, preparation and slow breathing."],["With family or close friends feelings run strong, so begin by saying that the relationship matters to you.","At work or school, stay factual, polite and specific, and suggest a clear next step.","With someone you do not know well, be brief and respectful, and remember that customs and expectations may differ."]],
s:[["Decide what you want","Write one sentence about the outcome you hope for. It stops you arguing about the past."],["Choose the moment","Pick a calm, private time. A hard topic raised in a hurry or in public rarely goes well."],["Say what you noticed and need","Describe what happened and how it affected you, without blaming. For example: ‘When this happened, I felt this. It would help if…’"],["Listen, then agree a next step","Let them speak without interrupting, repeat back what you heard, and agree on one clear action."]],
x:["Using ‘you always’ or ‘you never’","Raising the topic when you are angry","Trying to win instead of trying to understand"]},
{q:[["What would you like help with?",["Sleeping better","Handling stress","Building a healthy daily routine"]],["How long has this been going on?",["A few days","A few weeks","A long time"]]],
t:[["Sleep is trained by routine. A regular bedtime and a calm hour before bed help your body learn when to rest.","Stress is the body’s alarm. Slow breathing, writing worries down and doing one small thing can calm it.","A healthy routine is built from small repeated choices: water, movement, rest and time with people you trust."],["Over a few days this is often a short-term pattern, and simple habits can help.","If it has lasted weeks, keep gentle routines going and talk to someone you trust about it.","If it has lasted a long time, or it affects daily life, please speak to a doctor, nurse or counsellor. You deserve proper support."]],
s:[["Notice the pattern","For a few days, write down when it happens and what is going on around it. Patterns show what to change."],["Make one small change","Change one thing only, such as a fixed bedtime or five slow breaths. One change you keep beats five you drop."],["Use calming tools","Slow breathing (in for 4, out for 6), a short walk, or writing your thoughts can lower stress within minutes."],["Reach out","Tell someone you trust how you are doing. Support makes everything easier to carry."]],
x:["Trying to change everything at once","Staying silent when you need help","Using screens late at night"]},
{q:[["What are you looking for?",["Official help or services","A scholarship or training","A job or opportunity"]],["What worries you most?",["Finding the right place","Not being scammed","Not knowing how to apply"]]],
t:[["Official services are best found on the website of your government or the organisation itself, not through links sent in messages.","Real scholarships and training are usually free to apply for and have clear published rules and deadlines.","Genuine opportunities have a named organisation, a real address and clear requirements."],["To find the right place, search the official name and read its About and Contact pages.","To avoid scams, never pay to apply, never share ID or bank details early, and be careful when you are rushed.","If you do not know how to apply, read the instructions first, list the documents you need, and ask someone to review your application."]],
s:[["Write what you need","Describe exactly what you need and in which country. A precise need leads to better results."],["Find the official source","Search for the organisation’s own website and check the address carefully. Beware of lookalike names."],["Check it is genuine","Look for a real address, phone number and clear rules. If anyone asks for money or secrecy, stop and ask a trusted adult."],["Prepare and track","List the documents needed and the deadline, then save it in the Jobs & Opportunities tool."]],
